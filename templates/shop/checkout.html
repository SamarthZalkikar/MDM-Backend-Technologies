{% extends "base.html" %}
{% block content %}
<h1>Checkout</h1>
<h3>Total: ₹{{ total }}</h3>
<ul>
{% for i in items %}
    <li>{{ i.quantity }} x {{ i.product.name }} = ₹{{ i.subtotal }}</li>
{% endfor %}
</ul>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Place Order</button>
</form>
{% endblock %}
